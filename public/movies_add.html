
<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>映画データの追加</title>
</head>
<body>
  <h2>映画データの追加</h2>

  <form action="/movies_add" method="get">
    <p>
      ID：<input type="number" name="id" required>
    </p>
    <p>
      映画タイトル：<input type="text" name="title" required>
    </p>
    <p>
      ジャンル：<input type="text" name="genre" required>
    </p>
    <input type="submit" value="登録">
  </form>

  <p><a href="/movies">映画一覧に戻る</a></p>
</body>
</html>
